version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: creativeflow_db
    environment:
      POSTGRES_DB: creativeflow_db
      POSTGRES_USER: creative_user
      POSTGRES_PASSWORD: creative_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: creativeflow_app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - backend_media:/app/backend/media
    environment:
      DEBUG: "True"
      SECRET_KEY: "creativeflow-production-secret-key-change-me"
      ALLOWED_HOSTS: "*"
      DB_ENGINE: "django.db.backends.postgresql"
      DB_NAME: "creativeflow_db"
      DB_USER: "creative_user"
      DB_PASSWORD: "creative_password"
      DB_HOST: "db"
      DB_PORT: "5432"
    depends_on:
      - db

volumes:
  postgres_data:
  backend_media:
